<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>dominion</title>
<style>
  /* Flat cyan HUD, matching the portal (web/style.css). */
  :root {
    --bg:#070b0f; --bg-2:#04070a;
    --surface:#0d1420; --surface-2:#111b2a;
    --line:#1d2c40; --line-2:#2a3f5a;
    --ink:#dbeaf5; --ink-2:#9fb6cc; --mut:#748ca3;
    --chrome:#3fd0e6; --chrome-hover:#5fdceb; --acc-ink:#04121a;
    --bad:#ef6a6a;
    --r-sm:6px; --r-lg:12px;
    --ease:cubic-bezier(.2,.7,.3,1); --dur:160ms;
  }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--ink);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  :focus-visible { outline:2px solid var(--chrome); outline-offset:2px; }
  main { height:100%; display:grid; place-items:center; padding:24px; background:var(--bg); }
  form { width:min(92vw,340px); padding:26px; background:var(--surface); border:1px solid var(--line);
    border-radius:var(--r-lg); }
  h1 { margin:0 0 4px; font-size:20px; letter-spacing:.14em; font-weight:600; }
  p.sub { margin:0 0 18px; color:var(--mut); font-size:13px; }
  label { display:block; margin-bottom:6px; font-size:12px; text-transform:uppercase; letter-spacing:.12em; color:var(--mut); }
  input { width:100%; padding:11px 13px; font-size:16px; color:var(--ink); background:var(--bg-2);
    border:1px solid var(--line); border-radius:var(--r-sm); }
  input:focus { border-color:var(--chrome); }
  button { width:100%; margin-top:14px; padding:11px 14px; font-size:14px; font-weight:600;
    color:var(--acc-ink); background:var(--chrome); border:1px solid var(--chrome); border-radius:var(--r-sm);
    cursor:pointer; transition:background var(--dur) var(--ease), border-color var(--dur) var(--ease); }
  button:hover { background:var(--chrome-hover); border-color:var(--chrome-hover); }
  button:disabled { opacity:.5; cursor:default; }
  #force { color:var(--ink-2); background:transparent; border:1px solid var(--line-2); }
  #force:hover { color:var(--ink); background:transparent; border-color:var(--chrome); }
  .err { margin:12px 0 0; color:var(--bad); font-size:13px; }
  .row { display:flex; gap:10px; align-items:center; margin-top:14px; font-size:12px; color:var(--mut); }
  .row input { width:auto; }
  .link { margin-top:10px; color:var(--mut); background:transparent; border:none; font-weight:500; }
  .link:hover { color:var(--ink); background:transparent; }
  h2 { margin:22px 0 8px; font-size:12px; text-transform:uppercase; letter-spacing:.12em; color:var(--mut); font-weight:600; }
  h2:first-of-type { margin-top:6px; }
  ul.hosts { list-style:none; margin:0; padding:0; }
  ul.hosts li { display:flex; align-items:center; gap:10px; padding:9px 0; border-top:1px solid var(--line); }
  ul.hosts li .meta { flex:1; min-width:0; }
  ul.hosts .hname { display:block; font-size:14px; color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  ul.hosts .hurl { display:block; font-size:12px; color:var(--mut); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  ul.hosts button { width:auto; margin:0; padding:7px 10px; font-size:12px; }
  .host-del { color:var(--bad); background:transparent; border-color:var(--line-2); }
  .host-del:hover { border-color:var(--bad); background:transparent; }
  .empty-hosts { margin:6px 0 0; font-size:13px; color:var(--mut); }
  #view-settings { display:none; }
  body[data-view="settings"] #view-connect { display:none; }
  body[data-view="settings"] #view-settings { display:block; }
  @media (prefers-reduced-motion: reduce) {
    * { transition-duration:0ms !important; animation-duration:0ms !important; }
  }
</style>
</head>
<body>
<main>
  <form id="view-connect">
    <h1>dominion</h1>
    <p class="sub">Enter the portal address</p>
    <label for="host">Host and port</label>
    <input id="host" type="text" inputmode="url" autocomplete="off" autocapitalize="off"
           spellcheck="false" placeholder="YOUR-HOST:5550">
    <div class="row">
      <input id="insecure" type="checkbox">
      <label for="insecure" style="margin:0;text-transform:none;letter-spacing:0;font-size:12px">Connect over plain HTTP instead of HTTPS</label>
    </div>
    <button id="go" type="submit">Connect</button>
    <button id="force" type="button" hidden>Connect anyway</button>
    <button id="open-settings" type="button" class="link">Settings</button>
    <p id="error" class="err" hidden></p>
  </form>

  <form id="view-settings">
    <h1>Settings</h1>
    <p class="sub">Servers</p>
    <label for="s-host">Host and port</label>
    <input id="s-host" type="text" inputmode="url" autocomplete="off" autocapitalize="off"
           spellcheck="false" placeholder="YOUR-HOST:5550">
    <div class="row">
      <input id="s-insecure" type="checkbox">
      <label for="s-insecure" style="margin:0;text-transform:none;letter-spacing:0;font-size:12px">Use plain HTTP instead of HTTPS</label>
    </div>
    <label for="s-name" style="margin-top:14px">Save as (optional)</label>
    <input id="s-name" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="name for this server">
    <button id="s-apply" type="submit">Connect</button>
    <button id="s-save" type="button">Save this server</button>

    <h2>Saved servers</h2>
    <ul class="hosts" id="host-list"></ul>
    <p class="empty-hosts" id="hosts-empty" hidden>No saved servers yet.</p>

    <button id="close-settings" type="button" class="link">Back</button>
    <p id="s-error" class="err" hidden></p>
  </form>
</main>
<script src="bootstrap.js"></script>
</body>
</html>
